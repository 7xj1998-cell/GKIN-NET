name: Build GKIN.dll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build src/GKIN.csproj -c Release
      - name: Pack lisp + dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/GKIN.dll dist/GKIN.dll
          Copy-Item GKIN.lsp dist/GKIN.lsp
          Copy-Item README.txt dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath GKIN-APPLOAD.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: GKIN-APPLOAD
          path: GKIN-APPLOAD.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: GKIN v0.1.0
          files: GKIN-APPLOAD.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
